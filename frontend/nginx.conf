server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存（Vite 构建会带 hash，可以永久缓存）
    location ~* \.(js|css|woff2|woff|ttf|ico|png|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
