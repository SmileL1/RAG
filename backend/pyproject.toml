[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG 私有知识库系统 · 后端"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # ===== Web 框架 =====
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # ===== 数据验证 / 配置 =====
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # ===== 数据库 =====
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    # ===== 任务队列 =====
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # ===== RAG 核心 =====
    "llama-index>=0.11.0",
    "llama-index-vector-stores-qdrant>=0.3.0",
    "qdrant-client>=1.11.0",
    # ===== Embedding / Rerank =====
    "FlagEmbedding>=1.4.0",
    "sentence-transformers>=3.0.0",
    "dashscope>=1.20.0",
    # ===== LLM 调用 =====
    "openai>=1.40.0",
    # ===== 文档解析 =====
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "markdown>=3.6",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    # ===== 工具 =====
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "websockets>=13.0",
    "transformers>=4.44.2,<5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
