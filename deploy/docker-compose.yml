# 使用方式：
#   1. cp .env.production.example .env.production  并填写所有必填项
#   2. docker compose --env-file .env.production up -d
#
# 首次启动会自动下载：
#   - bge-m3 embedding 模型（约 2GB）
#   - bge-reranker-v2-m3 模型（约 1GB）
#   - Ollama qwen2.5:3b（约 2GB）
#   下载完成后均缓存在 Docker 卷中，重启不重新下载

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama
    container_name: rag-ollama
    restart: unless-stopped
    # GPU 支持（需要宿主机安装 nvidia-container-toolkit，无 GPU 则删除 deploy 块）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull ${OLLAMA_MODEL:-qwen2.5:3b} || echo "⚠ 模型拉取失败，可手动执行: docker exec rag-ollama ollama pull qwen2.5:3b"
        wait
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # HuggingFace 模型预下载（首次约需下载 3GB，已缓存则秒过）
  model-init:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: rag-model-init
    restart: "no"
    environment:
      HF_ENDPOINT: "https://huggingface.co"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - rag_models_cache:/root/.cache/rag_models
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, sys, time
        os.environ['HF_ENDPOINT'] = 'https://huggingface.co'
        from huggingface_hub import snapshot_download

        def log(msg):
            print(msg, flush=True)

        def download_with_retry(repo_id, max_retries=3, **kwargs):
            for i in range(max_retries):
                try:
                    snapshot_download(repo_id, **kwargs)
                    return
                except Exception as e:
                    if i < max_retries - 1:
                        wait = 30 * (i + 1)
                        log(f'⚠ 下载失败，{wait}s 后重试 ({i+1}/{max_retries}): {e}')
                        time.sleep(wait)
                    else:
                        raise

        log('>>> 下载 bge-m3（约 2GB）...')
        download_with_retry('BAAI/bge-m3')
        log('>>> bge-m3 完成')

        log('>>> 下载 bge-reranker-v2-m3（约 1GB）...')
        download_with_retry('BAAI/bge-reranker-v2-m3', local_dir='/root/.cache/rag_models/bge-reranker-v2-m3')
        log('>>> 所有模型下载完成')

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: rag-backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      HF_ENDPOINT: "https://huggingface.co"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface
      - rag_models_cache:/root/.cache/rag_models
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: rag-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  qdrant_data:
  uploads:
  hf_cache:
  rag_models_cache:
  ollama_data:
