# 使用方式：
#   1. cp .env.production.example .env.production  并填写所有必填项
#   2. docker compose --env-file .env.production up -d
#
# 如需 Celery worker（INGEST_MODE=celery）：
#   docker compose --env-file .env.production --profile celery up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    # 不对外暴露端口，只允许容器内网访问（backend 通过服务名 qdrant:6333 连接）
    volumes:
      - qdrant_data:/qdrant/storage
    # 如需启用 API Key 认证，取消注释并在 .env.production 填写 QDRANT_API_KEY
    # environment:
    #   QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: rag-backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      # HuggingFace 镜像（国内服务器）
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - uploads:/app/uploads
      # 模型缓存：避免每次重启都重新下载 bge-m3（~2GB）
      - hf_cache:/root/.cache/huggingface
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery Worker（仅在 INGEST_MODE=celery 时需要）
  # 启动方式：docker compose --profile celery up -d
  worker:
    profiles: ["celery"]
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: rag-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file: .env.production
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: rag-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  uploads:
  hf_cache:
